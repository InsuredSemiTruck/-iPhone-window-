  <title>日历</title>
  <style>
    :root{--bg:#fff;--toolbar:#f5f5f7;--sidebar:#f5f5f7;--grid:#e5e5ea;--text:#1d1d1f;--muted:#8e8e93;--muted-2:#6e6e73;--selected:#e8e8ed;--hover:#ededf0;--today:#ff3b30;--blue:#007aff;--radius:6px;--event-radius:4px;--hour-height:52px;--font:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}

    .toolbar-button:hover{color:var(--text);background:rgba(0,0,0,.05)}.toolbar-button:active{transform:scale(.96)}.toolbar-button--text{padding:0 12px}.toolbar-button--add{color:#fff;background:var(--blue);font-size:20px;line-height:1}.toolbar-button--add:hover{color:#fff;background:#006ee6}

    .calendar-item:hover{background:rgba(0,0,0,.035)}.calendar-item.is-selected{background:var(--selected)}.calendar-item input{width:12px;height:12px;margin:0;accent-color:var(--item-color);cursor:pointer}.calendar-dot{width:8px;height:8px;background:var(--item-color);border-radius:50%}.calendar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* 月视图 */

    .month-body{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}.month-week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0;border-top:1px solid var(--grid)}.month-week:first-child{border-top:0}

    /* 字号与可读性调整 */
    body{font-size:14px}.toolbar__title{font-size:18px}.calendar-item{min-height:36px;font-size:14px}.calendar-name{font-size:14px}.month-weekdays span{font-size:13px}.month-day__number{font-size:13px}.month-event{height:20px;font-size:12px}.month-more{font-size:11px}.week-day-header{font-size:13px}.allday-row__label,.day-allday__label{font-size:11px}.time-axis__hour{font-size:12px}.timed-event__title{font-size:13px}.timed-event__location{font-size:12px}.day-heading__number{font-size:46px}.day-heading__weekday{font-size:16px}.mini-calendar__header{font-size:14px}.mini-day{font-size:12px}.unscheduled-card h2{font-size:14px}.unscheduled-card p{font-size:12px}
    .week-scroll,.day-scroll{flex:1;min-height:0}.time-column{min-height:1248px}.week-header{min-width:760px}.time-grid,.allday-row{min-width:760px}

    :root{--calendar-font-size:10px;--ui-font-size:14px;--sidebar-width:180px}
    .calendar-main{display:flex;flex-direction:column}.view-root{flex:1;min-height:0;height:auto}

    function closeEventDelete(){isDeleteConfirming=false;if(eventDeleteHint){eventDeleteHint.textContent="";eventDeleteHint.hidden=true}if(eventDeleteActions)eventDeleteActions.replaceChildren();if(eventCancel)eventCancel.hidden=false;if(eventSubmit){eventSubmit.hidden=false;eventSubmit.disabled=false}}
    function deleteButton(label,className,handler){const button=document.createElement("button");button.type="button";button.className=`sheet-button ${className}`;button.textContent=label;button.addEventListener("click",handler);return button}
    function renderEventDelete(event){if(!eventDeleteActions||!event)return;const recurring=allEvents.filter(item=>item.uid&&item.uid===event.uid).length>1;eventDeleteHint.textContent="";eventDeleteHint.hidden=true;eventDeleteActions.replaceChildren();if(eventCancel)eventCancel.hidden=false;if(eventSubmit){eventSubmit.hidden=false;eventSubmit.disabled=false}if(!isDeleteConfirming){eventDeleteActions.append(deleteButton("删除日程","sheet-button--secondary",()=>{isDeleteConfirming=true;renderEventDelete(event)}));return}if(eventCancel)eventCancel.hidden=true;if(eventSubmit){eventSubmit.hidden=true;eventSubmit.disabled=true}eventDeleteHint.textContent=recurring?"删除后无法恢复：可只删除这一次，也可删除整个重复系列。":"删除后无法恢复，确认删除这条日程吗？";eventDeleteHint.hidden=false;if(recurring){eventDeleteActions.append(deleteButton("只删这一次","sheet-button--danger",()=>performDelete("instance",event)),deleteButton("删除整个系列","sheet-button--danger",()=>performDelete("series",event)))}else{eventDeleteActions.append(deleteButton("确认删除","sheet-button--danger",()=>performDelete("series",event)))}eventDeleteActions.append(deleteButton("取消","sheet-button--secondary",()=>{isDeleteConfirming=false;renderEventDelete(event)}))}
    async function performDelete(scope,calendarEvent){if(!editingUid||!eventDeleteActions)return;const payload={scope};if(scope==="instance"&&editingOriginalStart instanceof Date){payload.recurrenceId=editingAllDay?formatDateParam(editingOriginalStart):editingOriginalStart.toISOString()}isDeleteConfirming=false;eventDeleteHint.textContent="正在删除…";eventDeleteHint.hidden=false;eventDeleteActions.replaceChildren();try{const response=await fetch(`${apiUrl}/${encodeURIComponent(editingUid)}`,{method:"DELETE",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(payload)}),data=await response.json().catch(()=>({}));if(!response.ok){const detail=data.detail?`：${data.detail}`:"";throw new Error(`${data.error||`删除失败（${response.status}）`}${detail}`)}const range=requiredViewRange();closeCreate();await loadRange(addDays(range.start,-30),addDays(range.end,30),false);renderWithTransition();showToast(scope==="instance"?"已删除这一次日程":"日程已删除")}catch(error){renderEventDelete(calendarEvent);eventFormError.textContent=error.message}}
    function hideOccurrenceHint(){if(!eventFormHint)return;eventFormHint.textContent="";eventFormHint.hidden=true}
    function formatShortDate(date){return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`}
    function updateOccurrenceHint(event){if(!eventFormHint)return;if(!event||!event.uid||allEvents.filter(item=>item.uid&&item.uid===event.uid).length<2){hideOccurrenceHint();return}eventFormHint.textContent=`循环日程：本次只修改 ${formatShortDate(event.startDay)} 这一次`;eventFormHint.hidden=false}
    function openCreate(day=selectedDate,hour=9){editingUid="";editingOriginalStart=null;editingAllDay=false;closeEventDelete();hideOccurrenceHint();const start=new Date(day);start.setHours(Number.isInteger(hour)?hour:9,0,0,0);const end=new Date(start);end.setHours(end.getHours()+1);eventForm.reset();populateCalendarSelect();eventSheetTitle.textContent="新建日程";eventTitle.value="";eventStart.value=toDateTimeInput(start);eventEnd.value=toDateTimeInput(end);eventLocation.value="";eventFormError.textContent="";eventSubmit.disabled=false;eventSubmit.textContent="添加";eventModal.hidden=false;window.setTimeout(()=>eventTitle.focus(),0)}
    function closeCreate(){eventModal.hidden=true;eventForm.reset();editingUid="";editingOriginalStart=null;editingAllDay=false;closeEventDelete();hideOccurrenceHint();eventSheetTitle.textContent="新建日程";eventFormError.textContent="";eventSubmit.disabled=false;eventSubmit.textContent="添加"}
function openEdit(event){closeDayEvents();if(!event.uid)return;editingUid=event.uid;editingOriginalStart=event.start;editingAllDay=Boolean(event.allDay);eventForm.reset();populateCalendarSelect();eventCalendar.value=event.calendar;eventSheetTitle.textContent="编辑日程";eventTitle.value=event.title;eventStart.value=toDateTimeInput(event.start);eventEnd.value=toDateTimeInput(event.end);eventLocation.value=event.location||"";eventFormError.textContent="";eventSubmit.disabled=false;eventSubmit.textContent="保存";updateOccurrenceHint(event);isDeleteConfirming=false;renderEventDelete(event);eventModal.hidden=false;window.setTimeout(()=>eventTitle.focus(),0)}
    function bindEventEdit(element,event){element.addEventListener("dblclick",eventInfo=>{if(Date.now()<suppressEditUntil)return;eventInfo.stopPropagation();openEdit(event)})}
    function bindEventDrag(element,calendarEvent){if(!calendarEvent.uid||isLongAllDay(calendarEvent))return;element.classList.add("can-drag");element.addEventListener("pointerdown",pointerEvent=>{if(pointerEvent.button!==0)return;const state={event:calendarEvent,element,pointerId:pointerEvent.pointerId,startX:pointerEvent.clientX,startY:pointerEvent.clientY,active:false,timer:null,ghost:null,target:null};state.timer=window.setTimeout(()=>{if(dragState!==state)return;state.active=true;suppressEditUntil=Date.now()+900;startDragGhost(state)},500);dragState=state})}
    function startDragGhost(state){const rect=state.element.getBoundingClientRect(),ghost=state.element.cloneNode(true);ghost.classList.add("drag-ghost");ghost.style.left=`${rect.left}px`;ghost.style.top=`${rect.top}px`;ghost.style.width=`${rect.width}px`;ghost.style.height=`${rect.height}px`;document.body.appendChild(ghost);state.ghost=ghost;state.element.classList.add("is-dragging");document.body.classList.add("is-dragging-event")}
    function clearDragTarget(state){if(state.target)state.target.classList.remove("is-drop-target");state.target=null}
    function cleanupDrag(){if(!dragState)return;window.clearTimeout(dragState.timer);dragState.element.classList.remove("is-dragging");if(dragState.ghost)dragState.ghost.remove();clearDragTarget(dragState);document.body.classList.remove("is-dragging-event");dragState=null}
    function handleDragMove(pointerEvent){if(!dragState)return;if(!dragState.active){if(Math.hypot(pointerEvent.clientX-dragState.startX,pointerEvent.clientY-dragState.startY)>7){window.clearTimeout(dragState.timer);dragState=null}return}pointerEvent.preventDefault();const ghost=dragState.ghost;if(ghost){ghost.style.left=`${pointerEvent.clientX-30}px`;ghost.style.top=`${pointerEvent.clientY-14}px`}const cell=document.elementFromPoint(pointerEvent.clientX,pointerEvent.clientY)?.closest(".month-day")||null;if(cell!==dragState.target){clearDragTarget(dragState);if(cell&&cell.dataset.date){cell.classList.add("is-drop-target");dragState.target=cell}}}
    async function finishDrag(pointerEvent){if(!dragState)return;const state=dragState;window.clearTimeout(state.timer);if(!state.active){cleanupDrag();return}const target=state.target;cleanupDrag();if(!target||!target.dataset.date){showToast("请拖到当前可见的日期格");return}const targetDate=parseDateValue(target.dataset.date);if(!targetDate||sameDay(targetDate,state.event.startDay))return;await moveEventToDate(state.event,targetDate)}
    function cancelDrag(){cleanupDrag()}
    async function moveEventToDate(calendarEvent,targetDate){const previousStart=calendarEvent.start,previousEnd=calendarEvent.end,delta=dayDifference(targetDate,calendarEvent.startDay);let newStart,newEnd,startValue,endValue;if(calendarEvent.allDay){newStart=addDays(calendarEvent.start,delta);newEnd=addDays(calendarEvent.end,delta);startValue=formatDateParam(newStart);endValue=formatDateParam(newEnd)}else{newStart=new Date(targetDate);newStart.setHours(calendarEvent.start.getHours(),calendarEvent.start.getMinutes(),calendarEvent.start.getSeconds(),calendarEvent.start.getMilliseconds());const duration=calendarEvent.end.getTime()-calendarEvent.start.getTime();newEnd=new Date(newStart.getTime()+duration);startValue=newStart.toISOString();endValue=newEnd.toISOString()}applyEventTimes(calendarEvent,newStart,newEnd,calendarEvent.allDay);renderWithTransition();try{const response=await fetch(`${apiUrl}/${encodeURIComponent(calendarEvent.uid)}`,{method:"PUT",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({title:calendarEvent.title,calendar:calendarEvent.calendar,start:startValue,end:endValue,location:calendarEvent.location||"",recurrenceId:calendarEvent.allDay?formatDateParam(previousStart):previousStart.toISOString()})}),payload=await response.json().catch(()=>({}));if(!response.ok){const detail=payload.detail?`：${payload.detail}`:"";throw new Error(`${payload.error||`移动失败（${response.status}）`}${detail}`)}const range=requiredViewRange();await loadRange(addDays(range.start,-30),addDays(range.end,30),false);renderWithTransition();showToast("日程已移动")}catch(error){applyEventTimes(calendarEvent,previousStart,previousEnd,calendarEvent.allDay);renderWithTransition();showToast(`移动失败：${error.message}，已恢复到原位置`)}}
    function buildEventPayload(title,calendar,startValue,endValue,location,isEditing){const payload={title,calendar,start:new Date(startValue).toISOString(),end:new Date(endValue).toISOString(),location};if(isEditing&&editingOriginalStart instanceof Date){payload.recurrenceId=editingAllDay?formatDateParam(editingOriginalStart):editingOriginalStart.toISOString();if(editingAllDay){payload.start=formatDateParam(new Date(startValue));payload.end=formatDateParam(new Date(endValue))}}return payload}
    async function submitEvent(event){event.preventDefault();const title=eventTitle.value.trim(),calendar=eventCalendar.value,start=eventStart.value,end=eventEnd.value,location=eventLocation.value.trim();if(!title){eventFormError.textContent="请填写标题";return}if(!calendar){eventFormError.textContent="请选择所属日历";return}if(!start||!end||new Date(end)<=new Date(start)){eventFormError.textContent="结束时间必须晚于开始时间";return}eventFormError.textContent="";const isEditing=Boolean(editingUid),requestUrl=isEditing?`${apiUrl}/${encodeURIComponent(editingUid)}`:apiUrl;eventSubmit.disabled=true;eventSubmit.textContent=isEditing?"正在保存…":"正在添加…";try{const response=await fetch(requestUrl,{method:isEditing?"PUT":"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(buildEventPayload(title,calendar,start,end,location,isEditing))}),payload=await response.json().catch(()=>({}));if(!response.ok){const detail=payload.detail?`：${payload.detail}`:"";throw new Error(`${payload.error||`写入失败（${response.status}）`}${detail}`)}const createdDate=startOfDay(new Date(start));anchorDate=createdDate;selectedDate=createdDate;const range=requiredViewRange();await loadRange(addDays(range.start,-30),addDays(range.end,30),false);closeCreate();renderWithTransition()}catch(error){eventFormError.textContent=error.message}finally{eventSubmit.disabled=false;eventSubmit.textContent=isEditing?"保存":"添加"}}
    async function initialize(){calendarSettings=loadSettings();applySettings();try{const today=startOfDay(new Date());await loadRange(addDays(today,-30),addDays(today,31),true);if(!selectedCalendar)selectedCalendar=allEvents[0]?.calendar||DEFAULT_CALENDARS[0];renderCurrentView()}catch(error){viewRoot.replaceChildren(createStatusPanel("无法读取日历",`${error.message}。请确认后端已启动，并检查环境变量和终端日志。`))}}
    for(const button of viewButtons)button.addEventListener("click",async()=>{currentView=button.dataset.view;selectedDate=new Date(anchorDate);const ready=await ensureRangeForView();if(ready)renderWithTransition()});
    document.querySelector("#previous-button").addEventListener("click",()=>navigate(-1));document.querySelector("#next-button").addEventListener("click",()=>navigate(1));document.querySelector("#today-button").addEventListener("click",async()=>{anchorDate=startOfDay(new Date());selectedDate=startOfDay(new Date());const ready=await ensureRangeForView();if(ready)renderWithTransition()});
    addEventButton.addEventListener("click",()=>openCreate(selectedDate,9));refreshButton.addEventListener("click",manualRefresh);settingsButton.addEventListener("click",event=>{event.stopPropagation();toggleSettings()});darkModeSetting.addEventListener("change",()=>{calendarSettings.darkMode=darkModeSetting.checked;applySettings();saveSettings()});syncNowButton.addEventListener("click",manualSync);eventForm.addEventListener("submit",submitEvent);eventCancel.addEventListener("click",closeCreate);eventSheetClose.addEventListener("click",closeCreate);eventModal.addEventListener("click",event=>{if(event.target===eventModal)closeCreate()});dayEventsClose.addEventListener("click",closeDayEvents);dayEventsOverlay.addEventListener("click",event=>{if(event.target===dayEventsOverlay)closeDayEvents()});document.addEventListener("pointermove",handleDragMove);document.addEventListener("pointerup",finishDrag);document.addEventListener("pointercancel",cancelDrag);document.addEventListener("click",event=>{if(!settingsPanel.hidden&&!settingsPanel.contains(event.target)&&!settingsButton.contains(event.target))toggleSettings(false)});document.addEventListener("keydown",event=>{if(event.key!=="Escape")return;if(!eventModal.hidden)closeCreate();if(!dayEventsOverlay.hidden)closeDayEvents();if(!settingsPanel.hidden)toggleSettings(false)});
    initialize();
  </script>
