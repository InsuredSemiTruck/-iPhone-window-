<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="calendar-api-base" content="">
  <title>日历</title>
  <style>
    :root{--bg:#fff;--toolbar:#f5f5f7;--sidebar:#f5f5f7;--grid:#e5e5ea;--text:#1d1d1f;--muted:#8e8e93;--muted-2:#6e6e73;--selected:#e8e8ed;--hover:#ededf0;--today:#ff3b30;--blue:#007aff;--radius:6px;--event-radius:4px;--hour-height:52px;--font:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;color:var(--text);background:var(--bg);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    button,input{font:inherit}button{color:inherit}
    .app-shell{display:grid;grid-template-rows:52px minmax(0,1fr);width:100%;height:100dvh;min-height:520px}
    .toolbar{position:relative;z-index:50;display:grid;grid-template-columns:minmax(240px,1fr) auto minmax(300px,1fr);align-items:center;min-width:0;padding:0 12px;background:var(--toolbar);border-bottom:1px solid var(--grid);user-select:none}
    .toolbar__left,.toolbar__actions{display:flex;align-items:center;min-width:0}.toolbar__left{gap:8px}.toolbar__actions{justify-content:flex-end;gap:6px}
    .toolbar__title{overflow:hidden;font-size:17px;font-weight:600;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
    .sidebar-toggle{display:none;width:30px;height:30px;padding:0;color:var(--muted-2);background:transparent;border:0;border-radius:var(--radius);cursor:pointer;font-size:19px;line-height:1}
    .segmented{display:inline-flex;align-items:center;padding:2px;background:#e7e7eb;border-radius:7px}
    .segmented__button{min-width:42px;height:28px;padding:0 12px;color:var(--muted-2);background:transparent;border:0;border-radius:5px;cursor:pointer;transition:color .14s,background .14s,box-shadow .14s}
    .segmented__button:hover{color:var(--text)}.segmented__button.is-active{color:var(--text);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16)}
    .toolbar-button{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 9px;color:var(--muted-2);background:transparent;border:0;border-radius:var(--radius);cursor:pointer;transition:color .12s,background .12s,transform .12s}
    .toolbar-button:hover{color:var(--text);background:rgba(0,0,0,.05)}.toolbar-button:active{transform:scale(.96)}.toolbar-button--text{padding:0 12px}.toolbar-button--add{color:#fff;background:var(--blue);font-size:20px;line-height:1}.toolbar-button--add:hover{color:#fff;background:#006ee6}
    .workspace{display:grid;grid-template-columns:240px minmax(0,1fr);min-width:0;min-height:0;overflow:hidden}
    .sidebar{position:relative;z-index:40;display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px 12px;overflow:auto;background:var(--sidebar);border-right:1px solid var(--grid)}
    .sidebar__header{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px}.sidebar__title{margin:0;font-size:17px;font-weight:600}
    .sidebar__add{display:inline-grid;place-items:center;width:24px;height:24px;padding:0;color:var(--muted);background:transparent;border:0;border-radius:50%;cursor:default;font-size:19px;line-height:1}
    .calendar-list{display:grid;gap:2px}.calendar-item{display:grid;grid-template-columns:18px 12px minmax(0,1fr);align-items:center;gap:8px;min-height:32px;padding:5px 8px;border-radius:var(--radius);cursor:default;transition:background .12s}
    .calendar-item:hover{background:rgba(0,0,0,.035)}.calendar-item.is-selected{background:var(--selected)}.calendar-item input{width:14px;height:14px;margin:0;accent-color:var(--item-color);cursor:pointer}.calendar-dot{width:10px;height:10px;background:var(--item-color);border-radius:50%}.calendar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .calendar-main{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}.view-root{width:100%;height:100%;opacity:1;transform:translateY(0);transition:opacity .15s,transform .15s;overflow:hidden}.view-root.is-changing{opacity:.35;transform:translateY(2px)}
    .status-panel{display:grid;place-content:center;gap:8px;width:100%;height:100%;padding:32px;color:var(--muted);text-align:center}.status-panel__title{color:var(--text);font-size:17px;font-weight:600}.status-panel__detail{max-width:460px;line-height:1.5}
    /* 月视图 */
    .month-view{display:grid;grid-template-rows:32px minmax(0,1fr);width:100%;height:100%;min-height:0}.month-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;color:var(--muted);background:#fff;border-bottom:1px solid var(--grid);text-align:center}.month-weekdays span{font-size:12px;font-weight:600}
    .month-body{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}.month-week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0;border-top:1px solid var(--grid)}.month-week:first-child{border-top:0}
    .month-day{position:relative;min-width:0;min-height:0;padding:5px 6px 6px;overflow:hidden;background:#fff;border-left:1px solid var(--grid);cursor:default;transition:background .1s}.month-day:first-child{border-left:0}.month-day:hover{background:#fafafa}.month-day.is-outside{color:#aeaeb2;background:#fbfbfd}.month-day.is-selected{background:#eef5ff}
    .month-day__number{position:relative;z-index:4;display:inline-grid;place-items:center;width:24px;height:24px;margin-left:-2px;color:inherit;font-size:12px;line-height:1}.month-day.is-today .month-day__number{color:#fff;background:var(--today);border-radius:50%;font-weight:600}
    .month-day__events{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;min-width:0}.month-event{display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:center;gap:4px;min-width:0;height:18px;padding:0 4px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 17%,white);border-left:3px solid var(--event-color);border-radius:3px;cursor:default;font-size:11px;line-height:1;white-space:nowrap}
    .month-event:hover,.month-span-event:hover,.allday-bar:hover,.timed-event:hover{filter:brightness(.96);background:color-mix(in srgb,var(--event-color) 27%,white)}.month-event__dot{width:5px;height:5px;background:var(--event-color);border-radius:50%}.month-event__title{overflow:hidden;text-overflow:ellipsis}.month-event__time{color:var(--muted-2);font-size:10px}.month-more{height:16px;padding-left:4px;overflow:hidden;color:var(--muted);font-size:10px;line-height:16px;text-overflow:ellipsis;white-space:nowrap}
    .month-span-layer{position:absolute;inset:0;z-index:3;pointer-events:none}.month-span-event{pointer-events:auto;position:absolute;display:flex;align-items:center;gap:4px;height:18px;padding:0 5px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 20%,white);border-left:3px solid var(--event-color);border-radius:3px;font-size:11px;line-height:1;text-overflow:ellipsis;white-space:nowrap}.month-span-event__dot{flex:0 0 auto;width:5px;height:5px;background:var(--event-color);border-radius:50%}
    /* 周视图和日视图时间轴 */
    .week-view,.day-view{width:100%;height:100%;min-height:0}.week-view{display:flex;flex-direction:column}.week-scroll{min-height:0;overflow:auto}.week-header{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:64px repeat(7,minmax(92px,1fr));min-width:760px;height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--grid);backdrop-filter:blur(12px)}
    .week-header__gutter{border-right:1px solid var(--grid)}.week-day-header{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;border-left:1px solid var(--grid);cursor:default;font-size:12px}.week-day-header:first-of-type{border-left:0}.week-day-header__number{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:500}.week-day-header.is-today .week-day-header__number{color:#fff;background:var(--today)}.week-day-header.is-selected{background:#f2f7ff}
    .allday-row{display:grid;grid-template-columns:64px minmax(0,1fr);min-width:760px;background:#fff;border-bottom:1px solid var(--grid)}.allday-row__label{padding:8px 8px 0 0;color:var(--muted);border-right:1px solid var(--grid);text-align:right;font-size:10px}.allday-track{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:32px}.allday-track__cell{border-left:1px solid var(--grid)}.allday-track__cell:first-child{border-left:0}
    .allday-bar{position:absolute;z-index:3;display:flex;align-items:center;gap:5px;height:20px;padding:0 6px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 23%,white);border-left:3px solid var(--event-color);border-radius:var(--event-radius);font-size:11px;line-height:1;text-overflow:ellipsis;white-space:nowrap}.allday-bar__dot{flex:0 0 auto;width:5px;height:5px;background:var(--event-color);border-radius:50%}
    .time-grid{display:grid;grid-template-columns:64px minmax(0,1fr);min-width:760px}.time-axis{position:sticky;left:0;z-index:8;background:#fff;border-right:1px solid var(--grid)}.time-axis__hour{position:relative;height:var(--hour-height);padding:5px 8px 0 0;color:var(--muted);border-top:1px solid transparent;text-align:right;font-size:10px;line-height:1}.time-axis__hour span{position:relative;top:-7px;background:#fff;padding-left:4px}.time-columns{display:grid;grid-template-columns:repeat(var(--day-count),minmax(92px,1fr))}.time-column{position:relative;min-width:0;border-left:1px solid var(--grid)}.time-column:first-child{border-left:0}.time-column__hour{height:var(--hour-height);border-top:1px solid var(--grid)}.time-column__hour:first-child{border-top:0}
    .timed-event{position:absolute;z-index:5;display:flex;flex-direction:column;gap:2px;min-height:22px;padding:4px 5px 3px 7px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 17%,white);border:0;border-left:3px solid var(--event-color);border-radius:var(--event-radius);cursor:default;transition:background .12s,filter .12s}.timed-event__title{overflow:hidden;font-size:11px;font-weight:600;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.timed-event__location{overflow:hidden;color:var(--muted-2);font-size:10px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.timed-event.is-compact{padding-top:4px;padding-bottom:2px}.timed-event.is-compact .timed-event__location{display:none}
    .now-line{position:absolute;z-index:7;left:0;right:0;height:1px;background:var(--today);pointer-events:none}.now-line::before{position:absolute;top:-3px;left:-3px;width:7px;height:7px;content:"";background:var(--today);border-radius:50%}
    /* 日视图 */
    .day-view{display:grid;grid-template-columns:minmax(0,1fr) 286px;min-width:0}.day-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.day-heading{display:flex;align-items:flex-end;gap:12px;height:82px;padding:12px 20px;border-bottom:1px solid var(--grid)}.day-heading__number{font-size:42px;font-weight:300;line-height:.95}.day-heading__weekday{padding-bottom:4px;color:var(--muted-2);font-size:15px}
    .day-allday{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:34px;border-bottom:1px solid var(--grid)}.day-allday__label{padding:8px 8px 0 0;color:var(--muted);border-right:1px solid var(--grid);text-align:right;font-size:10px}.day-allday__track{position:relative;min-height:34px}.day-scroll{min-height:0;overflow:auto}.day-time-grid{display:grid;grid-template-columns:64px minmax(0,1fr);min-width:0}.day-time-grid .time-columns{--day-count:1}
    .day-sidebar{min-width:0;min-height:0;padding:20px;overflow:auto;background:#fbfbfd;border-left:1px solid var(--grid)}.mini-calendar{width:100%}.mini-calendar__header{margin-bottom:12px;font-size:13px;font-weight:600;text-align:center}.mini-calendar__weekdays,.mini-calendar__days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.mini-calendar__weekdays span{display:grid;place-items:center;height:24px;color:var(--muted);font-size:10px}
    .mini-day{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1;padding:0;color:var(--text);background:transparent;border:0;border-radius:50%;cursor:pointer;font-size:11px}.mini-day:hover{background:var(--hover)}.mini-day.is-outside{color:#c7c7cc}.mini-day.is-selected{background:var(--selected)}.mini-day.is-today{color:#fff;background:var(--today);font-weight:600}.mini-day__dot{position:absolute;bottom:1px;width:4px;height:4px;background:var(--today);border-radius:50%}.mini-day.is-today .mini-day__dot{display:none}.unscheduled-card{margin-top:28px;padding:14px;background:#fff;border:1px solid var(--grid);border-radius:8px}.unscheduled-card h2{margin:0;font-size:13px;font-weight:600}.unscheduled-card p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
    @media(max-width:980px){.toolbar{grid-template-columns:minmax(160px,1fr) auto minmax(210px,1fr)}.workspace{grid-template-columns:1fr}.sidebar{position:absolute;top:52px;bottom:0;left:0;width:240px;transform:translateX(-100%);transition:transform .18s}.sidebar.is-open{transform:translateX(0)}.sidebar-toggle{display:inline-grid;place-items:center}.day-view{grid-template-columns:1fr}.day-sidebar{display:none}}
    @media(max-width:700px){.toolbar{grid-template-columns:minmax(110px,1fr) auto auto;gap:6px}.toolbar__title{font-size:14px}.segmented__button{min-width:36px;padding:0 8px}.toolbar__actions{gap:2px}.toolbar-button{min-width:28px;padding:0 6px}.toolbar-button--text{padding:0 8px}.toolbar-button--add{display:none}.month-day{padding-inline:3px}.month-event{grid-template-columns:5px minmax(0,1fr)}.month-event__time{display:none}}
    /* 字号与可读性调整 */
    body{font-size:14px}.toolbar__title{font-size:18px}.calendar-item{min-height:36px;font-size:14px}.calendar-name{font-size:14px}.month-weekdays span{font-size:13px}.month-day__number{font-size:13px}.month-event{height:20px;font-size:12px}.month-more{font-size:11px}.week-day-header{font-size:13px}.allday-row__label,.day-allday__label{font-size:11px}.time-axis__hour{font-size:12px}.timed-event__title{font-size:13px}.timed-event__location{font-size:12px}.day-heading__number{font-size:46px}.day-heading__weekday{font-size:16px}.mini-calendar__header{font-size:14px}.mini-day{font-size:12px}.unscheduled-card h2{font-size:14px}.unscheduled-card p{font-size:12px}
    .week-scroll,.day-scroll{flex:1;min-height:0}.time-column{min-height:1248px}.week-header{min-width:760px}.time-grid,.allday-row{min-width:760px}
    /* 新建日程面板 */
    .modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px)}
    .modal-backdrop[hidden]{display:none}.event-sheet{width:min(560px,100%);max-height:min(760px,92vh);overflow:auto;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.22)}
    .event-sheet__header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--grid);backdrop-filter:blur(12px)}.event-sheet__header h2{margin:0;font-size:19px}.event-sheet__close{display:grid;place-items:center;width:30px;height:30px;padding:0;color:var(--muted-2);background:transparent;border:0;border-radius:50%;cursor:pointer;font-size:22px}.event-sheet__close:hover{background:var(--hover)}
    .event-form{display:grid;gap:16px;padding:20px}.form-field{display:grid;gap:7px}.form-field span{color:var(--muted-2);font-size:12px}.form-field input,.form-field select{width:100%;height:42px;padding:0 12px;color:var(--text);background:#fff;border:1px solid #d2d2d7;border-radius:7px;outline:none}.form-field input:focus,.form-field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.14)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.event-form__error{min-height:20px;margin:0;color:#c93400;font-size:12px}.event-form__actions{display:flex;justify-content:flex-end;gap:10px;padding-top:4px}.sheet-button{height:38px;padding:0 16px;border:0;border-radius:7px;cursor:pointer}.sheet-button--secondary{color:var(--text);background:#e8e8ed}.sheet-button--primary{color:#fff;background:var(--blue)}.sheet-button:active{transform:scale(.97)}.sheet-button:disabled{opacity:.55;cursor:wait}
    @media(max-width:560px){.form-row{grid-template-columns:1fr}.event-sheet{max-height:94vh}.global-nav,.toolbar{padding-inline:8px}}
    /* 字体与间距最终覆盖，保持 iCloud 留白感 */
    .toolbar__title{font-size:18px;font-weight:700}
    .calendar-item,.calendar-name{font-size:14px}
    .calendar-item{min-height:36px;padding:6px 8px}
    .month-weekdays span{font-size:13px;font-weight:600}
    .month-day__number{font-size:14px}
    .month-event{height:22px;padding:0 5px;font-size:14px;line-height:1.25}
    .month-event__time{font-size:12px}
    .month-more{font-size:12px}
    .week-day-header{font-size:13px}
    .time-axis__hour{font-size:12px}
    .timed-event{padding:6px 7px 5px 9px;line-height:1.3}
    .timed-event__title{font-size:14px;line-height:1.25}
    .timed-event__location{font-size:12px;line-height:1.25}
    .allday-bar{height:22px;padding:0 7px;font-size:12px;line-height:1.25}
    .day-heading__number{font-size:46px}.day-heading__weekday{font-size:16px}
    .mini-calendar__header{font-size:14px}.mini-day{font-size:12px}
    .unscheduled-card h2{font-size:14px}.unscheduled-card p{font-size:12px}
    :root{--calendar-font-size:14px;--ui-font-size:18px}
    .calendar-main{display:flex;flex-direction:column}.view-root{flex:1;min-height:0;height:auto}
    .toolbar-button--icon{font-size:18px}.toolbar-button.is-loading{pointer-events:none}.toolbar-button.is-loading #refresh-icon{display:inline-block;animation:calendar-spin .8s linear infinite}
    @keyframes calendar-spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;right:20px;bottom:20px;z-index:120;padding:10px 14px;color:#fff;background:rgba(29,29,31,.92);border-radius:8px;font-size:14px}.toast[hidden]{display:none}
    .settings-popover{position:fixed;top:52px;right:12px;z-index:90;width:min(330px,calc(100vw - 24px));padding:18px;background:rgba(255,255,255,.98);border:1px solid var(--grid);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.16);backdrop-filter:blur(16px)}
    .settings-popover[hidden]{display:none}.settings-popover h2{margin:0 0 16px;font-size:18px;font-weight:700}.settings-field{display:grid;gap:10px;margin-top:14px}.settings-field span{display:flex;justify-content:space-between;color:var(--muted-2);font-size:14px}.settings-field output{color:var(--text);font-weight:600}.settings-field input[type="range"]{width:100%;accent-color:var(--blue)}
    .long-events-panel{flex:0 0 auto;max-height:176px;overflow:auto;background:#fbfbfd;border-top:1px solid var(--grid);padding:10px 16px 12px}.long-events-panel[hidden]{display:none}.long-events-panel h2{margin:0 0 8px;color:var(--muted-2);font-size:14px;font-weight:600}.long-events-list{display:grid;gap:6px}.long-event-item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,1fr) minmax(90px,.7fr);gap:12px;align-items:center;padding:7px 10px;background:#fff;border-left:3px solid var(--event-color);border-radius:5px;font-size:var(--calendar-font-size)}.long-event-item__title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.long-event-item__range,.long-event-item__calendar{color:var(--muted-2);font-size:calc(var(--calendar-font-size) - 2px)}.month-week,.month-day,.time-column__hour{border-color:#e5e5ea}.view-root.is-filtering{opacity:0;transition:opacity .1s ease-in}.view-root:not(.is-filtering){transition:opacity .18s ease-out}
    .toolbar__title{font-size:var(--ui-font-size)!important}.calendar-item,.calendar-name{font-size:var(--ui-font-size)!important}.month-weekdays span,.week-day-header,.time-axis__hour,.month-day__number{font-size:var(--ui-font-size)!important}.month-event,.timed-event__title{font-size:var(--calendar-font-size)!important}.month-event__time,.timed-event__location,.allday-bar{font-size:calc(var(--calendar-font-size) - 2px)!important}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div class="toolbar__left">
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="打开日历列表">☰</button>
        <div class="toolbar__title" id="toolbar-title">日历</div>
      </div>
      <div class="segmented" aria-label="日历视图">
        <button class="segmented__button" type="button" data-view="day">日</button>
        <button class="segmented__button" type="button" data-view="week">周</button>
        <button class="segmented__button is-active" type="button" data-view="month">月</button>
      </div>
      <div class="toolbar__actions">
        <button class="toolbar-button" id="previous-button" type="button" aria-label="上一时间段">‹</button>
        <button class="toolbar-button toolbar-button--text" id="today-button" type="button">今天</button>
        <button class="toolbar-button" id="next-button" type="button" aria-label="下一时间段">›</button>
        <button class="toolbar-button toolbar-button--icon" id="refresh-button" type="button" aria-label="刷新日历" title="刷新日历"><span id="refresh-icon">↻</span></button>
        <button class="toolbar-button toolbar-button--icon" id="settings-button" type="button" aria-label="日历设置" title="日历设置">⚙︎</button>
        <button class="toolbar-button toolbar-button--add" type="button" aria-label="新增事件">+</button>
      </div>
    </header>
    <div class="workspace">

    function animateCalendarToggle(){if(filterAnimationRunning)return;filterAnimationRunning=true;viewRoot.classList.add("is-filtering");window.setTimeout(()=>{renderCurrentView();requestAnimationFrame(()=>{viewRoot.classList.remove("is-filtering");window.setTimeout(()=>{filterAnimationRunning=false},190)})},100)}    function loadSettings(){try{const saved=JSON.parse(localStorage.getItem("calendar-settings-v1")||"{}"),fontSize=Number(saved.fontSize),threshold=Number(saved.compressionThreshold);return{fontSize:fontSize>=12&&fontSize<=20?fontSize:14,compressionThreshold:threshold>=2&&threshold<=30?threshold:5}}catch{return{fontSize:14,compressionThreshold:5}}}
    function saveSettings(){try{localStorage.setItem("calendar-settings-v1",JSON.stringify(calendarSettings))}catch{}}
    function applySettings(){document.documentElement.style.setProperty("--calendar-font-size",`${calendarSettings.fontSize}px`);document.documentElement.style.setProperty("--ui-font-size",`${calendarSettings.fontSize+4}px`);fontSizeSetting.value=calendarSettings.fontSize;fontSizeOutput.textContent=`${calendarSettings.fontSize}px`;thresholdSetting.value=calendarSettings.compressionThreshold;thresholdOutput.textContent=`${calendarSettings.compressionThreshold}天`}
    function isLongAllDay(event){return event.allDay&&dayDifference(event.lastDay,event.startDay)+1>calendarSettings.compressionThreshold}
    function formatDateOnly(date){return `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()}`}
    function renderLongEvents(events){longEventsList.replaceChildren();if(!events.length){longEventsPanel.hidden=true;return}longEventsPanel.hidden=false;const sorted=[...events].sort((a,b)=>a.start-b.start);for(const event of sorted){const item=document.createElement("div");item.className="long-event-item";item.style.setProperty("--event-color",event.color);const title=document.createElement("div");title.className="long-event-item__title";title.textContent=event.title;const range=document.createElement("div");range.className="long-event-item__range";range.textContent=`${formatDateOnly(event.startDay)} – ${formatDateOnly(event.lastDay)}`;const calendar=document.createElement("div");calendar.className="long-event-item__calendar";calendar.textContent=event.calendar;item.append(title,range,calendar);bindEventEdit(item,event);longEventsList.appendChild(item)}}    function showToast(message){const toast=document.querySelector("#toast");if(!toast)return;toast.textContent=message;toast.hidden=false;window.clearTimeout(showToast.timer);showToast.timer=window.setTimeout(()=>{toast.hidden=true},2600)}
    async function manualRefresh(){if(refreshButton.classList.contains("is-loading"))return;refreshButton.classList.add("is-loading");refreshButton.disabled=true;try{const response=await fetch(`${apiBase}/api/refresh`,{method:"POST",headers:{Accept:"application/json"}}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||`刷新失败（${response.status}）`);const events=(payload.events||[]).map(normalizeEvent).filter(Boolean);allEvents=events;registerCalendars(events);if(payload.range?.start&&payload.range?.end)loadedRange=[parseDateValue(payload.range.start),parseDateValue(payload.range.end)];renderWithTransition();showToast("日历已刷新")}catch(error){showToast(`刷新失败：${error.message}`)}finally{refreshButton.classList.remove("is-loading");refreshButton.disabled=false}}
    function toggleSettings(force){settingsPanel.hidden=typeof force==="boolean"?force:!settingsPanel.hidden}    function renderCurrentView(){updateToolbar();renderSidebar();if(currentView==="month")renderMonth();else{renderLongEvents([]);if(currentView==="week")renderWeek();else renderDay()}}
    function renderWithTransition(){if(document.startViewTransition){document.startViewTransition(()=>renderCurrentView());return}viewRoot.classList.add("is-changing");window.setTimeout(()=>{renderCurrentView();requestAnimationFrame(()=>viewRoot.classList.remove("is-changing"))},80)}
    function formatDateParam(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`}
    function requiredViewRange(){if(currentView==="month"){const start=startOfWeek(startOfMonth(anchorDate));return{start,end:addDays(start,42)}}if(currentView==="week"){const start=startOfWeek(anchorDate);return{start,end:addDays(start,7)}}const start=startOfDay(anchorDate);return{start,end:addDays(start,1)}}
    function rangeCovered(start,end){if(!loadedRange)return false;return loadedRange[0]<=startOfDay(start)&&loadedRange[1]>=startOfDay(end)}
    function registerCalendars(events){for(const event of events){if(!calendars.has(event.calendar)){calendars.set(event.calendar,event.color);visibleCalendars.add(event.calendar)}}}
    async function fetchEvents(start,end,useDefault=false){const query=useDefault?"":`?start=${formatDateParam(start)}&end=${formatDateParam(end)}`,response=await fetch(apiUrl+query,{headers:{Accept:"application/json"}}),payload=await response.json();if(!response.ok)throw new Error(payload.error||`请求失败（${response.status}）`);const rawEvents=Array.isArray(payload)?payload:(payload.events||[]);return rawEvents.map(normalizeEvent).filter(Boolean)}
    async function loadRange(start,end,useDefault=false){const requestId=++rangeRequestId;isLoading=true;try{const events=await fetchEvents(start,end,useDefault);if(requestId!==rangeRequestId)return;allEvents=events;loadedRange=[startOfDay(start),startOfDay(end)];registerCalendars(events)}finally{if(requestId===rangeRequestId)isLoading=false}}
    async function ensureRangeForView(force=false){const range=requiredViewRange();if(!force&&rangeCovered(range.start,range.end))return true;try{await loadRange(addDays(range.start,-30),addDays(range.end,30),false);return true}catch(error){viewRoot.replaceChildren(createStatusPanel("无法读取日历",`${error.message}。请确认后端已启动，并检查环境变量和终端日志。`));return false}}
    async function selectDate(day,openCreatePanel=false,hour=9){selectedDate=new Date(day);anchorDate=new Date(day);const ready=await ensureRangeForView();if(!ready)return;renderWithTransition();if(openCreatePanel)openCreate(day,hour)}
    async function navigate(amount){if(currentView==="month")anchorDate=addMonths(anchorDate,amount);else if(currentView==="week")anchorDate=addDays(anchorDate,amount*7);else anchorDate=addDays(anchorDate,amount);selectedDate=new Date(anchorDate);const ready=await ensureRangeForView();if(ready)renderWithTransition()}
    function toDateTimeInput(date){return `${formatDateParam(date)}T${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`}
    function populateCalendarSelect(){eventCalendar.replaceChildren();for(const name of calendars.keys()){const option=document.createElement("option");option.value=name;option.textContent=name;eventCalendar.appendChild(option)}eventCalendar.value=calendars.has(selectedCalendar)?selectedCalendar:(calendars.keys().next().value||"")}
    function openCreate(day=selectedDate,hour=9){editingUid="";const start=new Date(day);start.setHours(Number.isInteger(hour)?hour:9,0,0,0);const end=new Date(start);end.setHours(end.getHours()+1);eventForm.reset();populateCalendarSelect();eventSheetTitle.textContent="新建日程";eventTitle.value="";eventStart.value=toDateTimeInput(start);eventEnd.value=toDateTimeInput(end);eventLocation.value="";eventFormError.textContent="";eventSubmit.disabled=false;eventSubmit.textContent="添加";eventModal.hidden=false;window.setTimeout(()=>eventTitle.focus(),0)}
    function closeCreate(){eventModal.hidden=true;eventForm.reset();editingUid="";eventSheetTitle.textContent="新建日程";eventFormError.textContent="";eventSubmit.disabled=false;eventSubmit.textContent="添加"}
function openEdit(event){if(!event.uid)return;editingUid=event.uid;eventForm.reset();populateCalendarSelect();eventCalendar.value=event.calendar;eventSheetTitle.textContent="编辑日程";eventTitle.value=event.title;eventStart.value=toDateTimeInput(event.start);eventEnd.value=toDateTimeInput(event.end);eventLocation.value=event.location||"";eventFormError.textContent="";eventSubmit.disabled=false;eventSubmit.textContent="保存";eventModal.hidden=false;window.setTimeout(()=>eventTitle.focus(),0)}
    function bindEventEdit(element,event){element.addEventListener("dblclick",eventInfo=>{eventInfo.stopPropagation();openEdit(event)})}
    async function submitEvent(event){event.preventDefault();const title=eventTitle.value.trim(),calendar=eventCalendar.value,start=eventStart.value,end=eventEnd.value,location=eventLocation.value.trim();if(!title){eventFormError.textContent="请填写标题";return}if(!calendar){eventFormError.textContent="请选择所属日历";return}if(!start||!end||new Date(end)<=new Date(start)){eventFormError.textContent="结束时间必须晚于开始时间";return}eventFormError.textContent="";const isEditing=Boolean(editingUid),requestUrl=isEditing?`${apiUrl}/${encodeURIComponent(editingUid)}`:apiUrl;eventSubmit.disabled=true;eventSubmit.textContent=isEditing?"正在保存…":"正在添加…";try{const response=await fetch(requestUrl,{method:isEditing?"PUT":"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({title,calendar,start:new Date(start).toISOString(),end:new Date(end).toISOString(),location})}),payload=await response.json().catch(()=>({}));if(!response.ok){const detail=payload.detail?`：${payload.detail}`:"";throw new Error(`${payload.error||`写入失败（${response.status}）`}${detail}`)}const createdDate=startOfDay(new Date(start));anchorDate=createdDate;selectedDate=createdDate;const range=requiredViewRange();await loadRange(addDays(range.start,-30),addDays(range.end,30),false);closeCreate();renderWithTransition()}catch(error){eventFormError.textContent=error.message}finally{eventSubmit.disabled=false;eventSubmit.textContent=isEditing?"保存":"添加"}}
    async function initialize(){calendarSettings=loadSettings();applySettings();try{const today=startOfDay(new Date());await loadRange(addDays(today,-30),addDays(today,31),true);if(!selectedCalendar)selectedCalendar=allEvents[0]?.calendar||DEFAULT_CALENDARS[0];renderCurrentView()}catch(error){viewRoot.replaceChildren(createStatusPanel("无法读取日历",`${error.message}。请确认后端已启动，并检查环境变量和终端日志。`))}}
    for(const button of viewButtons)button.addEventListener("click",async()=>{currentView=button.dataset.view;selectedDate=new Date(anchorDate);const ready=await ensureRangeForView();if(ready)renderWithTransition()});
    document.querySelector("#previous-button").addEventListener("click",()=>navigate(-1));document.querySelector("#next-button").addEventListener("click",()=>navigate(1));document.querySelector("#today-button").addEventListener("click",async()=>{anchorDate=startOfDay(new Date());selectedDate=startOfDay(new Date());const ready=await ensureRangeForView();if(ready)renderWithTransition()});sidebarToggle.addEventListener("click",()=>sidebar.classList.toggle("is-open"));
    addEventButton.addEventListener("click",()=>openCreate(selectedDate,9));eventForm.addEventListener("submit",submitEvent);eventCancel.addEventListener("click",closeCreate);eventSheetClose.addEventListener("click",closeCreate);eventModal.addEventListener("click",event=>{if(event.target===eventModal)closeCreate()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!eventModal.hidden)closeCreate()});
    initialize();
  </script>
