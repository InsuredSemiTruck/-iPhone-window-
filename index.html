<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="calendar-api-base" content="">
  <title>日历</title>
  <style>
    :root{--bg:#fff;--toolbar:#f5f5f7;--sidebar:#f5f5f7;--grid:#e5e5ea;--text:#1d1d1f;--muted:#8e8e93;--muted-2:#6e6e73;--selected:#e8e8ed;--hover:#ededf0;--today:#ff3b30;--blue:#007aff;--radius:6px;--event-radius:4px;--hour-height:60px;--font:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;color:var(--text);background:var(--bg);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    button,input{font:inherit}button{color:inherit}
    .app-shell{display:grid;grid-template-rows:52px minmax(0,1fr);width:100%;height:100dvh;min-height:520px}
    .toolbar{position:relative;z-index:50;display:grid;grid-template-columns:minmax(240px,1fr) auto minmax(300px,1fr);align-items:center;min-width:0;padding:0 12px;background:var(--toolbar);border-bottom:1px solid var(--grid);user-select:none}
    .toolbar__left,.toolbar__actions{display:flex;align-items:center;min-width:0}.toolbar__left{gap:8px}.toolbar__actions{justify-content:flex-end;gap:6px}
    .toolbar__title{overflow:hidden;font-size:17px;font-weight:600;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
    .sidebar-toggle{display:none;width:30px;height:30px;padding:0;color:var(--muted-2);background:transparent;border:0;border-radius:var(--radius);cursor:pointer;font-size:19px;line-height:1}
    .segmented{display:inline-flex;align-items:center;padding:2px;background:#e7e7eb;border-radius:7px}
    .segmented__button{min-width:42px;height:28px;padding:0 12px;color:var(--muted-2);background:transparent;border:0;border-radius:5px;cursor:pointer;transition:color .14s,background .14s,box-shadow .14s}
    .segmented__button:hover{color:var(--text)}.segmented__button.is-active{color:var(--text);background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16)}
    .toolbar-button{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 9px;color:var(--muted-2);background:transparent;border:0;border-radius:var(--radius);cursor:pointer;transition:color .12s,background .12s,transform .12s}
    .toolbar-button:hover{color:var(--text);background:rgba(0,0,0,.05)}.toolbar-button:active{transform:scale(.96)}.toolbar-button--text{padding:0 12px}.toolbar-button--add{color:#fff;background:var(--blue);font-size:20px;line-height:1}.toolbar-button--add:hover{color:#fff;background:#006ee6}
    .workspace{display:grid;grid-template-columns:240px minmax(0,1fr);min-width:0;min-height:0;overflow:hidden}
    .sidebar{position:relative;z-index:40;display:flex;flex-direction:column;min-width:0;min-height:0;padding:18px 12px;overflow:auto;background:var(--sidebar);border-right:1px solid var(--grid)}
    .sidebar__header{display:flex;align-items:center;justify-content:space-between;padding:0 8px 12px}.sidebar__title{margin:0;font-size:17px;font-weight:600}
    .sidebar__add{display:inline-grid;place-items:center;width:24px;height:24px;padding:0;color:var(--muted);background:transparent;border:0;border-radius:50%;cursor:default;font-size:19px;line-height:1}
    .calendar-list{display:grid;gap:2px}.calendar-item{display:grid;grid-template-columns:18px 12px minmax(0,1fr);align-items:center;gap:8px;min-height:32px;padding:5px 8px;border-radius:var(--radius);cursor:default;transition:background .12s}
    .calendar-item:hover{background:rgba(0,0,0,.035)}.calendar-item.is-selected{background:var(--selected)}.calendar-item input{width:14px;height:14px;margin:0;accent-color:var(--item-color);cursor:pointer}.calendar-dot{width:10px;height:10px;background:var(--item-color);border-radius:50%}.calendar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .calendar-main{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}.view-root{width:100%;height:100%;opacity:1;transform:translateY(0);transition:opacity .15s,transform .15s;overflow:hidden}.view-root.is-changing{opacity:.35;transform:translateY(2px)}
    .status-panel{display:grid;place-content:center;gap:8px;width:100%;height:100%;padding:32px;color:var(--muted);text-align:center}.status-panel__title{color:var(--text);font-size:17px;font-weight:600}.status-panel__detail{max-width:460px;line-height:1.5}
    /* 月视图 */
    .month-view{display:grid;grid-template-rows:32px minmax(0,1fr);width:100%;height:100%;min-height:0}.month-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;color:var(--muted);background:#fff;border-bottom:1px solid var(--grid);text-align:center}.month-weekdays span{font-size:12px;font-weight:600}
    .month-body{display:grid;grid-template-rows:repeat(6,minmax(0,1fr));min-height:0}.month-week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:0;border-top:1px solid var(--grid)}.month-week:first-child{border-top:0}
    .month-day{position:relative;min-width:0;min-height:0;padding:5px 6px 6px;overflow:hidden;background:#fff;border-left:1px solid var(--grid);cursor:default;transition:background .1s}.month-day:first-child{border-left:0}.month-day:hover{background:#fafafa}.month-day.is-outside{color:#aeaeb2;background:#fbfbfd}.month-day.is-selected{background:#eef5ff}
    .month-day__number{position:relative;z-index:4;display:inline-grid;place-items:center;width:24px;height:24px;margin-left:-2px;color:inherit;font-size:12px;line-height:1}.month-day.is-today .month-day__number{color:#fff;background:var(--today);border-radius:50%;font-weight:600}
    .month-day__events{position:relative;z-index:1;display:flex;flex-direction:column;gap:2px;min-width:0}.month-event{display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:center;gap:4px;min-width:0;height:18px;padding:0 4px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 17%,white);border-left:3px solid var(--event-color);border-radius:3px;cursor:default;font-size:11px;line-height:1;white-space:nowrap}
    .month-event:hover,.month-span-event:hover,.allday-bar:hover,.timed-event:hover{filter:brightness(.96);background:color-mix(in srgb,var(--event-color) 27%,white)}.month-event__dot{width:5px;height:5px;background:var(--event-color);border-radius:50%}.month-event__title{overflow:hidden;text-overflow:ellipsis}.month-event__time{color:var(--muted-2);font-size:10px}.month-more{height:16px;padding-left:4px;overflow:hidden;color:var(--muted);font-size:10px;line-height:16px;text-overflow:ellipsis;white-space:nowrap}
    .month-span-layer{position:absolute;inset:0;z-index:3;pointer-events:none}.month-span-event{pointer-events:auto;position:absolute;display:flex;align-items:center;gap:4px;height:18px;padding:0 5px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 20%,white);border-left:3px solid var(--event-color);border-radius:3px;font-size:11px;line-height:1;text-overflow:ellipsis;white-space:nowrap}.month-span-event__dot{flex:0 0 auto;width:5px;height:5px;background:var(--event-color);border-radius:50%}
    /* 周视图和日视图时间轴 */
    .week-view,.day-view{width:100%;height:100%;min-height:0}.week-view{display:flex;flex-direction:column}.week-scroll{min-height:0;overflow:auto}.week-header{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:64px repeat(7,minmax(92px,1fr));min-width:760px;height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--grid);backdrop-filter:blur(12px)}
    .week-header__gutter{border-right:1px solid var(--grid)}.week-day-header{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;border-left:1px solid var(--grid);cursor:default;font-size:12px}.week-day-header:first-of-type{border-left:0}.week-day-header__number{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:500}.week-day-header.is-today .week-day-header__number{color:#fff;background:var(--today)}.week-day-header.is-selected{background:#f2f7ff}
    .allday-row{display:grid;grid-template-columns:64px minmax(0,1fr);min-width:760px;background:#fff;border-bottom:1px solid var(--grid)}.allday-row__label{padding:8px 8px 0 0;color:var(--muted);border-right:1px solid var(--grid);text-align:right;font-size:10px}.allday-track{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-height:32px}.allday-track__cell{border-left:1px solid var(--grid)}.allday-track__cell:first-child{border-left:0}
    .allday-bar{position:absolute;z-index:3;display:flex;align-items:center;gap:5px;height:20px;padding:0 6px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 23%,white);border-left:3px solid var(--event-color);border-radius:var(--event-radius);font-size:11px;line-height:1;text-overflow:ellipsis;white-space:nowrap}.allday-bar__dot{flex:0 0 auto;width:5px;height:5px;background:var(--event-color);border-radius:50%}
    .time-grid{display:grid;grid-template-columns:64px minmax(0,1fr);min-width:760px}.time-axis{position:sticky;left:0;z-index:8;background:#fff;border-right:1px solid var(--grid)}.time-axis__hour{position:relative;height:var(--hour-height);padding:5px 8px 0 0;color:var(--muted);border-top:1px solid transparent;text-align:right;font-size:10px;line-height:1}.time-axis__hour span{position:relative;top:-7px;background:#fff;padding-left:4px}.time-columns{display:grid;grid-template-columns:repeat(var(--day-count),minmax(92px,1fr))}.time-column{position:relative;min-width:0;border-left:1px solid var(--grid)}.time-column:first-child{border-left:0}.time-column__hour{height:var(--hour-height);border-top:1px solid var(--grid)}.time-column__hour:first-child{border-top:0}
    .timed-event{position:absolute;z-index:5;display:flex;flex-direction:column;gap:2px;min-height:22px;padding:4px 5px 3px 7px;overflow:hidden;color:#2c2c2e;background:color-mix(in srgb,var(--event-color) 17%,white);border:0;border-left:3px solid var(--event-color);border-radius:var(--event-radius);cursor:default;transition:background .12s,filter .12s}.timed-event__title{overflow:hidden;font-size:11px;font-weight:600;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.timed-event__location{overflow:hidden;color:var(--muted-2);font-size:10px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}.timed-event.is-compact{padding-top:4px;padding-bottom:2px}.timed-event.is-compact .timed-event__location{display:none}
    .now-line{position:absolute;z-index:7;left:0;right:0;height:1px;background:var(--today);pointer-events:none}.now-line::before{position:absolute;top:-3px;left:-3px;width:7px;height:7px;content:"";background:var(--today);border-radius:50%}
    /* 日视图 */
    .day-view{display:grid;grid-template-columns:minmax(0,1fr) 286px;min-width:0}.day-main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}.day-heading{display:flex;align-items:flex-end;gap:12px;height:82px;padding:12px 20px;border-bottom:1px solid var(--grid)}.day-heading__number{font-size:42px;font-weight:300;line-height:.95}.day-heading__weekday{padding-bottom:4px;color:var(--muted-2);font-size:15px}
    .day-allday{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:34px;border-bottom:1px solid var(--grid)}.day-allday__label{padding:8px 8px 0 0;color:var(--muted);border-right:1px solid var(--grid);text-align:right;font-size:10px}.day-allday__track{position:relative;min-height:34px}.day-scroll{min-height:0;overflow:auto}.day-time-grid{display:grid;grid-template-columns:64px minmax(0,1fr);min-width:0}.day-time-grid .time-columns{--day-count:1}
    .day-sidebar{min-width:0;min-height:0;padding:20px;overflow:auto;background:#fbfbfd;border-left:1px solid var(--grid)}.mini-calendar{width:100%}.mini-calendar__header{margin-bottom:12px;font-size:13px;font-weight:600;text-align:center}.mini-calendar__weekdays,.mini-calendar__days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.mini-calendar__weekdays span{display:grid;place-items:center;height:24px;color:var(--muted);font-size:10px}
    .mini-day{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:1;padding:0;color:var(--text);background:transparent;border:0;border-radius:50%;cursor:pointer;font-size:11px}.mini-day:hover{background:var(--hover)}.mini-day.is-outside{color:#c7c7cc}.mini-day.is-selected{background:var(--selected)}.mini-day.is-today{color:#fff;background:var(--today);font-weight:600}.mini-day__dot{position:absolute;bottom:1px;width:4px;height:4px;background:var(--today);border-radius:50%}.mini-day.is-today .mini-day__dot{display:none}.unscheduled-card{margin-top:28px;padding:14px;background:#fff;border:1px solid var(--grid);border-radius:8px}.unscheduled-card h2{margin:0;font-size:13px;font-weight:600}.unscheduled-card p{margin:6px 0 0;color:var(--muted);font-size:11px;line-height:1.45}
    @media(max-width:980px){.toolbar{grid-template-columns:minmax(160px,1fr) auto minmax(210px,1fr)}.workspace{grid-template-columns:1fr}.sidebar{position:absolute;top:52px;bottom:0;left:0;width:240px;transform:translateX(-100%);transition:transform .18s}.sidebar.is-open{transform:translateX(0)}.sidebar-toggle{display:inline-grid;place-items:center}.day-view{grid-template-columns:1fr}.day-sidebar{display:none}}
    @media(max-width:700px){.toolbar{grid-template-columns:minmax(110px,1fr) auto auto;gap:6px}.toolbar__title{font-size:14px}.segmented__button{min-width:36px;padding:0 8px}.toolbar__actions{gap:2px}.toolbar-button{min-width:28px;padding:0 6px}.toolbar-button--text{padding:0 8px}.toolbar-button--add{display:none}.month-day{padding-inline:3px}.month-event{grid-template-columns:5px minmax(0,1fr)}.month-event__time{display:none}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div class="toolbar__left">
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="打开日历列表">☰</button>
        <div class="toolbar__title" id="toolbar-title">日历</div>
      </div>
      <div class="segmented" aria-label="日历视图">
        <button class="segmented__button" type="button" data-view="day">日</button>
        <button class="segmented__button" type="button" data-view="week">周</button>
        <button class="segmented__button is-active" type="button" data-view="month">月</button>
      </div>
      <div class="toolbar__actions">
        <button class="toolbar-button" id="previous-button" type="button" aria-label="上一时间段">‹</button>
        <button class="toolbar-button toolbar-button--text" id="today-button" type="button">今天</button>
        <button class="toolbar-button" id="next-button" type="button" aria-label="下一时间段">›</button>
        <button class="toolbar-button toolbar-button--add" type="button" aria-label="新增事件">+</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <h1 class="sidebar__title">日历</h1>
          <button class="sidebar__add" type="button" aria-label="添加日历">+</button>
        </div>
        <div class="calendar-list" id="calendar-list"></div>
      </aside>
      <main class="calendar-main" id="calendar-main">
        <div class="view-root" id="view-root">
          <div class="status-panel">
            <div class="status-panel__title">正在读取日历</div>
            <div class="status-panel__detail">正在从 iCloud CalDAV 获取事件…</div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script>
    const apiBase=(document.querySelector('meta[name="calendar-api-base"]').content||"").replace(/\/$/,""),apiUrl=`${apiBase}/api/events`;
    const viewRoot=document.querySelector("#view-root"),toolbarTitle=document.querySelector("#toolbar-title"),calendarList=document.querySelector("#calendar-list"),sidebar=document.querySelector("#sidebar"),sidebarToggle=document.querySelector("#sidebar-toggle"),viewButtons=Array.from(document.querySelectorAll("[data-view]"));
    const HOUR_START=9,HOUR_END=21,HOUR_HEIGHT=60,WEEKDAY_SHORT=["日","一","二","三","四","五","六"],WEEKDAY_LONG=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"],MONTH_NAMES=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
    const CALENDAR_RULES=[{pattern:/个人|personal/i,color:"#34c759"},{pattern:/家庭|family/i,color:"#ffcc00"},{pattern:/课程|class|course/i,color:"#ff2d55"},{pattern:/课外|extracurricular/i,color:"#ff9500"},{pattern:/计划|作业|plan|homework|assignment/i,color:"#af52de"}];
    const FALLBACK_COLORS=["#ff3b30","#ff9500","#ffcc00","#34c759","#30b0c7","#007aff","#af52de","#ff2d55"],DEFAULT_CALENDARS=["个人","家庭","课程","课外","计划"];
    let currentView="month",anchorDate=startOfDay(new Date()),selectedDate=startOfDay(new Date()),selectedCalendar="",allEvents=[],calendars=new Map(),visibleCalendars=new Set();
    for(const name of DEFAULT_CALENDARS){calendars.set(name,colorForCalendar(name));visibleCalendars.add(name)}
    function startOfDay(value){const d=new Date(value);return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
    function addDays(value,amount){const d=new Date(value);d.setDate(d.getDate()+amount);return d}
    function addMonths(value,amount){return new Date(value.getFullYear(),value.getMonth()+amount,1)}
    function startOfWeek(value){const d=startOfDay(value);d.setDate(d.getDate()-d.getDay());return d}
    function startOfMonth(value){return new Date(value.getFullYear(),value.getMonth(),1)}
    function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
    function sameMonth(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()}
    function dayDifference(a,b){const x=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()),y=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());return Math.round((x-y)/86400000)}
    function parseDateValue(value){if(!value)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(String(value))){const p=String(value).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}const d=new Date(value);return Number.isNaN(d.getTime())?null:d}
    function isDateOnly(value){return /^\d{4}-\d{2}-\d{2}$/.test(String(value||""))}
    function colorForCalendar(name){const normalized=String(name||"未命名日历"),rule=CALENDAR_RULES.find(item=>item.pattern.test(normalized));if(rule)return rule.color;let hash=0;for(const ch of normalized)hash=((hash<<5)-hash)+ch.charCodeAt(0);return FALLBACK_COLORS[Math.abs(hash)%FALLBACK_COLORS.length]}
    function normalizeEvent(raw){const start=parseDateValue(raw.start),allDay=isDateOnly(raw.start);let end=parseDateValue(raw.end);if(!start)return null;if(!end)end=allDay?addDays(start,1):new Date(start);if(allDay&&end<=start)end=addDays(start,1);if(!allDay&&end<start)end=new Date(start);const calendar=String(raw.calendar||"未命名日历"),event={calendar,title:String(raw.title||"（无标题）"),location:String(raw.location||""),start,end,allDay,color:colorForCalendar(calendar),startDay:startOfDay(start),lastDay:startOfDay(end)};if(allDay)event.lastDay=addDays(event.lastDay,-1);else if(end.getHours()===0&&end.getMinutes()===0&&end.getSeconds()===0&&end>start)event.lastDay=addDays(event.lastDay,-1);if(event.lastDay<event.startDay)event.lastDay=new Date(event.startDay);event.isMultiDay=event.lastDay>event.startDay;return event}
    function visibleEvents(){return allEvents.filter(event=>visibleCalendars.has(event.calendar))}
    function formatMonthYear(date){return `${date.getFullYear()}年 ${MONTH_NAMES[date.getMonth()]}`}
    function formatFullDate(date){return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日 ${WEEKDAY_LONG[date.getDay()]}`}
    function formatClock(date){return `${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`}
    function formatHourLabel(hour){if(hour===12)return"正午";return hour<12?`上午${hour}时`:`下午${hour-12}时`}
    function updateToolbar(){if(currentView==="month")toolbarTitle.textContent=formatMonthYear(anchorDate);else if(currentView==="week"){const start=startOfWeek(anchorDate),end=addDays(start,6);toolbarTitle.textContent=`${formatMonthYear(start)} · ${start.getDate()}日–${end.getDate()}日`}else toolbarTitle.textContent=formatFullDate(anchorDate);for(const button of viewButtons)button.classList.toggle("is-active",button.dataset.view===currentView)}
    function renderSidebar(){calendarList.replaceChildren();for(const[name,color]of calendars){const row=document.createElement("div");row.className="calendar-item";row.style.setProperty("--item-color",color);row.classList.toggle("is-selected",selectedCalendar===name);const checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=visibleCalendars.has(name);checkbox.setAttribute("aria-label",`显示${name}`);const dot=document.createElement("span");dot.className="calendar-dot";const label=document.createElement("span");label.className="calendar-name";label.textContent=name;checkbox.addEventListener("click",event=>event.stopPropagation());checkbox.addEventListener("change",()=>{if(checkbox.checked)visibleCalendars.add(name);else visibleCalendars.delete(name);renderCurrentView()});row.addEventListener("click",()=>{selectedCalendar=selectedCalendar===name?"":name;renderSidebar()});row.append(checkbox,dot,label);calendarList.appendChild(row)}}
    function createStatusPanel(title,detail){const panel=document.createElement("div");panel.className="status-panel";const h=document.createElement("div");h.className="status-panel__title";h.textContent=title;const p=document.createElement("div");p.className="status-panel__detail";p.textContent=detail;panel.append(h,p);return panel}
    function createMonthEvent(event){const chip=document.createElement("div");chip.className="month-event";chip.style.setProperty("--event-color",event.color);chip.title=`${event.title}${event.location?` · ${event.location}`:""}`;const dot=document.createElement("span");dot.className="month-event__dot";const title=document.createElement("span");title.className="month-event__title";title.textContent=event.title;const time=document.createElement("span");time.className="month-event__time";time.textContent=event.allDay?"":formatClock(event.start);chip.append(dot,title,time);return chip}

    function renderMonth(){const monthStart=startOfMonth(anchorDate),gridStart=startOfWeek(monthStart),today=startOfDay(new Date()),events=visibleEvents(),multiDayEvents=events.filter(event=>event.isMultiDay),view=document.createElement("div");view.className="month-view";const weekdays=document.createElement("div");weekdays.className="month-weekdays";for(const name of WEEKDAY_SHORT){const label=document.createElement("span");label.textContent=name;weekdays.appendChild(label)}const body=document.createElement("div");body.className="month-body";for(let weekIndex=0;weekIndex<6;weekIndex++){const weekStart=addDays(gridStart,weekIndex*7),weekEnd=addDays(weekStart,6),week=document.createElement("div");week.className="month-week";const segments=multiDayEvents.filter(event=>event.startDay<=weekEnd&&event.lastDay>=weekStart).map(event=>{const visibleStart=event.startDay<weekStart?weekStart:event.startDay,visibleEnd=event.lastDay>weekEnd?weekEnd:event.lastDay;return{event,startColumn:dayDifference(visibleStart,weekStart),endColumn:dayDifference(visibleEnd,weekStart)+1}}),laneCount=assignSegmentsToLanes(segments);for(let dayIndex=0;dayIndex<7;dayIndex++){const day=addDays(weekStart,dayIndex),cell=document.createElement("div");cell.className="month-day";cell.classList.toggle("is-outside",!sameMonth(day,monthStart));cell.classList.toggle("is-today",sameDay(day,today));cell.classList.toggle("is-selected",sameDay(day,selectedDate));const number=document.createElement("div");number.className="month-day__number";number.textContent=day.getDate();cell.appendChild(number);const dayEvents=events.filter(event=>!event.isMultiDay&&event.startDay<=day&&event.lastDay>=day).sort((a,b)=>a.start-b.start),eventContainer=document.createElement("div");eventContainer.className="month-day__events";eventContainer.style.marginTop=laneCount?`${laneCount*20}px`:"0";const availableRows=Math.max(1,3-laneCount);for(const event of dayEvents.slice(0,availableRows))eventContainer.appendChild(createMonthEvent(     function eventTimeRange(event){const dayStart=new Date(event.start);dayStart.setHours(0,0,0,0);const startMinutes=(event.start-dayStart)/60000;let endMinutes=(event.end-dayStart)/60000;if(endMinutes<=startMinutes)endMinutes=startMinutes+30;const visibleStart=Math.max(startMinutes,HOUR_START*60),visibleEnd=Math.min(endMinutes,HOUR_END*60);if(visibleStart>=visibleEnd)return null;return{top:((visibleStart-HOUR_START*60)/60)*HOUR_HEIGHT,height:Math.max(22,((visibleEnd-visibleStart)/60)*HOUR_HEIGHT-2)}}

    function createTimedEvent(event){const range=eventTimeRange(event);if(!range)return null;const block=document.createElement("div");block.className="timed-event";if(range.height<38)block.classList.add("is-compact");block.style.setProperty("--event-color",event.color);block.style.top=`${range.top}px`;block.style.height=`${range.height}px`;block.style.left=`${(event.lane/event.laneCount)*100}%`;block.style.width=`${(1/event.laneCount)*100}%`;const title=document.createElement("div");title.className="timed-event__title";title.textContent=event.title;const location=document.createElement("div");location.className="timed-event__location";location.textContent=event.location||formatClock(event.start);block.append(title,location);return block}
    function createTimeAxis(){const axis=document.createElement("div");axis.className="time-axis";for(let hour=HOUR_START;hour<HOUR_END;hour++){const label=document.createElement("div");label.className="time-axis__hour";const text=document.createElement("span");text.textContent=formatHourLabel(hour);label.appendChild(text);axis.appendChild(label)}return axis}
    function createTimeColumns(days,events){const columns=document.createElement("div");columns.className="time-columns";columns.style.setProperty("--day-count",days.length);const now=new Date(),nowMinutes=now.getHours()*60+now.getMinutes();for(const day of days){const column=document.createElement("div");column.className="time-column";for(let hour=HOUR_START;hour<HOUR_END;hour++){const line=document.createElement("div");line.className="time-column__hour";column.appendChild(line)}const dayEvents=events.filter(event=>!event.allDay&&event.startDay<=day&&event.lastDay>=day),positioned=layoutTimedEvents(dayEvents);for(const event of positioned){const block=createTimedEvent(event);if(block)column.appendChild(block)}if(sameDay(day,now)&&nowMinutes>=HOUR_START*60&&nowMinutes<=HOUR_END*60){const line=document.createElement("div");line.className="now-line";line.style.top=`${((nowMinutes-HOUR_START*60)/60)*HOUR_HEIGHT}px`;column.appendChild(line)}columns.appendChild(column)}return columns}
    function createAlldayTrack(days,events){const track=document.createElement("div");track.className="allday-track";for(let i=0;i<days.length;i++){const cell=document.createElement("div");cell.className="allday-track__cell";track.appendChild(cell)}if(!days.length)return track;const rangeStart=days[0],rangeEnd=days[days.length-1],segments=events.filter(event=>event.allDay&&event.startDay<=rangeEnd&&event.lastDay>=rangeStart).map(event=>{const visibleStart=event.startDay<rangeStart?rangeStart:event.startDay,visibleEnd=event.lastDay>rangeEnd?rangeEnd:event.lastDay;return{event,startColumn:dayDifference(visibleStart,rangeStart),endColumn:dayDifference(visibleEnd,rangeStart)+1}}),laneCount=assignSegmentsToLanes(segments),trackHeight=Math.max(32,8+laneCount*20);for(const segment of segments){const bar=document.createElement("div");bar.className="allday-bar";bar.style.setProperty("--event-color",segment.event.color);bar.style.left=`calc(${(segment.startColumn/days.length)*100}% + 2px)`;bar.style.width=`calc(${((segment.endColumn-segment.startColumn)/days.length)*100}% - 4px)`;bar.style.top=`${4+segment.lane*20}px`;bar.title=`${segment.event.title}${segment.event.location?` · ${segment.event.location}`:""}`;const dot=document.createElement("span");dot.className="allday-bar__dot";const title=document.createElement("span");title.textContent=segment.event.title;bar.append(dot,title);track.appendChild(bar)}track.style.minHeight=`${trackHeight}px`;return track}
    function renderWeek(){const weekStart=startOfWeek(anchorDate),days=Array.from({length:7},(_,i)=>addDays(weekStart,i)),events=visibleEvents(),today=startOfDay(new Date()),view=document.createElement("div");view.className="week-view";const scroll=document.createElement("div");scroll.className="week-scroll",header=document.createElement("div");header.className="week-header";const gutter=document.createElement("div");gutter.className="week-header__gutter";header.appendChild(gutter);for(const day of days){const headerDay=document.createElement("div");headerDay.className="week-day-header";headerDay.classList.toggle("is-today",sameDay(day,today));headerDay.classList.toggle("is-selected",sameDay(day,selectedDate));const weekday=document.createElement("span");weekday.textContent=WEEKDAY_LONG[day.getDay()];const number=document.createElement("span");number.className="week-day-header__number";number.textContent=day.getDate();headerDay.append(weekday,number);headerDay.addEventListener("click",()=>{selectedDate=new Date(day);anchorDate=new Date(day);renderCurrentView()});header.appendChild(headerDay)}const alldayRow=document.createElement("div");alldayRow.className="allday-row";const alldayLabel=document.createElement("div");alldayLabel.className="allday-row__label";alldayLabel.textContent="全天";alldayRow.append(alldayLabel,createAlldayTrack(days,events));const timeGrid=document.createElement("div");timeGrid.className="time-grid";timeGrid.append(createTimeAxis(),createTimeColumns(days,events));scroll.append(header,alldayRow,timeGrid);view.appendChild(scroll);viewRoot.replaceChildren(view)}
    function renderMiniCalendar(date){const wrapper=document.createElement("div");wrapper.className="mini-calendar";const header=document.createElement("div");header.className="mini-calendar__header";header.textContent=formatMonthYear(date);const weekdays=document.createElement("div");weekdays.className="mini-calendar__weekdays";for(const name of WEEKDAY_SHORT){const label=document.createElement("span");label.textContent=name;weekdays.appendChild(label)}const days=document.createElement("div");days.className="mini-calendar__days",monthStart=startOfMonth(date),gridStart=startOfWeek(monthStart),today=startOfDay(new Date());for(let i=0;i<42;i++){const day=addDays(gridStart,i),button=document.createElement("button");button.type="button";button.className="mini-day";button.textContent=day.getDate();button.classList.toggle("is-outside",!sameMonth(day,monthStart));button.classList.toggle("is-today",sameDay(day,today));button.classList.toggle("is-selected",sameDay(day,selectedDate));const hasEvent=visibleEvents().some(event=>event.startDay<=day&&event.lastDay>=day);if(hasEvent&&!sameDay(day,today)){const dot=document.createElement("span");dot.className="mini-day__dot";button.appendChild(dot)}button.addEventListener("click",()=>{selectedDate=new Date(day);anchorDate=new Date(day);renderCurrentView()});days.appendChild(button)}wrapper.append(header,weekdays,days);return wrapper}
    function renderDay(){const day=startOfDay(anchorDate),events=visibleEvents(),dayEvents=events.filter(event=>event.startDay<=day&&event.lastDay>=day),view=document.createElement("div");view.className="day-view";const main=document.createElement("div");main.className="day-main";const heading=document.createElement("div");heading.className="day-heading";const number=document.createElement("div");number.className="day-heading__number";number.textContent=day.getDate();const weekday=document.createElement("div");weekday.className="day-heading__weekday";weekday.textContent=WEEKDAY_LONG[day.getDay()];heading.append(number,weekday);const allday=document.createElement("div");allday.className="day-allday";const alldayLabel=document.createElement("div");alldayLabel.className="day-allday__label";alldayLabel.textContent="全天";const alldayTrack=document.createElement("div");alldayTrack.className="day-allday__track";const allDayEvents=dayEvents.filter(event=>event.allDay);alldayTrack.style.minHeight=`${Math.max(34,8+allDayEvents.length*20)}px`;allDayEvents.forEach((event,index)=>{const bar=document.createElement("div");bar.className="allday-bar";bar.style.setProperty("--event-color",event.color);bar.style.left="4px";bar.style.right="4px";bar.style.width="auto";bar.style.top=`${4+index*20}px`;bar.title=`${event.title}${event.location?` · ${event.location}`:""}`;const dot=document.createElement("span");dot.className="allday-bar__dot";const title=document.createElement("span");title.textContent=event.title;bar.append(dot,title);alldayTrack.appendChild(bar)});allday.append(alldayLabel,alldayTrack);const scroll=document.createElement("div");scroll.className="day-scroll";const timeGrid=document.createElement("div");timeGrid.className="day-time-grid";timeGrid.append(createTimeAxis(),createTimeColumns([day],events));scroll.appendChild(timeGrid);main.append(heading,allday,scroll);const side=document.createElement("aside");side.className="day-sidebar";side.appendChild(renderMiniCalendar(d     function renderCurrentView(){updateToolbar();renderSidebar();if(currentView==="month")renderMonth();else if(currentView==="week")renderWeek();else renderDay()}
    function renderWithTransition(){if(document.startViewTransition){document.startViewTransition(()=>renderCurrentView());return}viewRoot.classList.add("is-changing");window.setTimeout(()=>{renderCurrentView();requestAnimationFrame(()=>viewRoot.classList.remove("is-changing"))},80)}
    function navigate(amount){if(currentView==="month")anchorDate=addMonths(anchorDate,amount);else if(currentView==="week")anchorDate=addDays(anchorDate,amount*7);else anchorDate=addDays(anchorDate,amount);selectedDate=new Date(anchorDate);renderWithTransition()}
    async function fetchEvents(){const response=await fetch(apiUrl,{headers:{Accept:"application/json"}}),payload=await response.json();if(!response.ok)throw new Error(payload.error||`请求失败（${response.status}）`);const rawEvents=Array.isArray(payload)?payload:(payload.events||[]);return rawEvents.map(normalizeEvent).filter(Boolean)}
    async function initialize(){try{allEvents=await fetchEvents();for(const event of allEvents){if(!calendars.has(event.calendar)){calendars.set(event.calendar,event.color);visibleCalendars.add(event.calendar)}}if(!selectedCalendar)selectedCalendar=allEvents[0]?.calendar||DEFAULT_CALENDARS[0];renderCurrentView()}catch(error){viewRoot.replaceChildren(createStatusPanel("无法读取日历",`${error.message}。请确认后端已启动，并检查环境变量和终端日志。`))}}
